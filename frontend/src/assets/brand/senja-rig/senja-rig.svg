<svg xmlns="http://www.w3.org/2000/svg" id="senja-rig" viewBox="20 40 310 430" width="310" height="430">
  <!--
    Senja rig: master source. Neutral pose, 3/4 view, traced from senja-waving.png
    (coordinates are that PNG's pixel space). Every <g id> is an independently
    movable layer; data-pivot="x y" is its rotation origin (use as GSAP svgOrigin).
    Hidden areas (head under ears, body under arms/scarf, tail and legs behind body)
    are drawn complete. Expression states sit at opacity 0 until swapped in.
    Run scripts/build-rig.mjs after editing to regenerate parts/ and the HyperFrames copy.
  -->
