name: wbd-k08

x-backend-image: &backend-image
  image: wbd-k08-backend:local
  pull_policy: never

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_ADDRESS: ":8080"
  HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-3m}
  HTTP_TRUSTED_ORIGINS: ${HTTP_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  PLATFORM_DATABASE_URL: postgres://${PLATFORM_DB_USER:-platform}:${PLATFORM_DB_PASSWORD:-platform_dev_password}@platform-db:5432/${PLATFORM_DB_NAME:-platform_db}?sslmode=disable
  PLATFORM_DB_MIN_CONNECTIONS: ${PLATFORM_DB_MIN_CONNECTIONS:-2}
  PLATFORM_DB_MAX_CONNECTIONS: ${PLATFORM_DB_MAX_CONNECTIONS:-10}
  PLATFORM_DB_MAX_CONNECTION_IDLE: ${PLATFORM_DB_MAX_CONNECTION_IDLE:-5m}
  PLATFORM_DB_MAX_CONNECTION_LIFETIME: ${PLATFORM_DB_MAX_CONNECTION_LIFETIME:-30m}
  PLATFORM_DB_HEALTH_TIMEOUT: ${PLATFORM_DB_HEALTH_TIMEOUT:-5s}
  SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-30m}
  SESSION_ABSOLUTE_TIMEOUT: ${SESSION_ABSOLUTE_TIMEOUT:-12h}
  SESSION_ROTATION_INTERVAL: ${SESSION_ROTATION_INTERVAL:-15m}
  SESSION_PREVIOUS_TOKEN_GRACE: ${SESSION_PREVIOUS_TOKEN_GRACE:-30s}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dbmp_session}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-10}
  LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-1m}
  MANAGED_DB_CREDENTIAL_KEY: ${MANAGED_DB_CREDENTIAL_KEY:?MANAGED_DB_CREDENTIAL_KEY wajib diisi pada .env}
  MANAGED_DB_CREDENTIAL_KEY_VERSION: ${MANAGED_DB_CREDENTIAL_KEY_VERSION:-1}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_SERVICE_NAME: dbmp-backend
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${APP_ENV:-development}

services:
  platform-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${PLATFORM_DB_USER:-platform}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:-platform_dev_password}
      POSTGRES_DB: ${PLATFORM_DB_NAME:-platform_db}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "${PLATFORM_DB_PORT:-55432}:5432"
    volumes:
      - platform-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  target-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${TARGET_DB_USER:-target_owner}
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD:-target_dev_password}
      POSTGRES_DB: ${TARGET_DB_NAME:-target_db}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "${TARGET_DB_PORT:-55433}:5432"
    volumes:
      - target-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mysql-target:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_TARGET_DB_NAME:-target_mysql}
      MYSQL_USER: ${MYSQL_TARGET_DB_USER:-target_owner}
      MYSQL_PASSWORD: ${MYSQL_TARGET_DB_PASSWORD:-target_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_TARGET_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "${MYSQL_TARGET_DB_PORT:-55434}:3306"
    volumes:
      - mysql-target-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrate:
    <<: *backend-image
    # Build the shared image once. API, worker, and bootstrap all depend on migrate.
    build:
      context: ./backend
    command: ["/usr/local/bin/migrate", "up"]
    environment: *backend-environment
    depends_on:
      platform-db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-image
    command: ["/usr/local/bin/api"]
    volumes:
      - app-logs:/var/log/dbmp
    environment:
      <<: *backend-environment
      APP_LOG_FILE: /var/log/dbmp/application.jsonl
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      platform-db:
        condition: service_healthy
      target-db:
        condition: service_healthy
      mysql-target:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  worker:
    <<: *backend-image
    command: ["/usr/local/bin/worker"]
    volumes:
      - app-logs:/var/log/dbmp
    environment:
      <<: *backend-environment
      APP_LOG_FILE: /var/log/dbmp/worker.jsonl
      OTEL_SERVICE_NAME: dbmp-worker
      MIGRATION_WORKER_CONCURRENCY: ${MIGRATION_WORKER_CONCURRENCY:-4}
      MIGRATION_WORKER_POLL_INTERVAL: ${MIGRATION_WORKER_POLL_INTERVAL:-1s}
      MIGRATION_WORKER_LEASE_DURATION: ${MIGRATION_WORKER_LEASE_DURATION:-45s}
      MIGRATION_WORKER_HEARTBEAT_INTERVAL: ${MIGRATION_WORKER_HEARTBEAT_INTERVAL:-10s}
      MIGRATION_WORKER_RECOVERY_LOCK_TIMEOUT: ${MIGRATION_WORKER_RECOVERY_LOCK_TIMEOUT:-300ms}
      MIGRATION_WORKER_MAX_RETRIES: ${MIGRATION_WORKER_MAX_RETRIES:-5}
      MIGRATION_WORKER_RETRY_BASE_DELAY: ${MIGRATION_WORKER_RETRY_BASE_DELAY:-2s}
      MIGRATION_WORKER_RETRY_MAX_DELAY: ${MIGRATION_WORKER_RETRY_MAX_DELAY:-1m}
    depends_on:
      platform-db:
        condition: service_healthy
      target-db:
        condition: service_healthy
      mysql-target:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: wbd-k08-frontend:local
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  bootstrap-admin:
    <<: *backend-image
    profiles: ["tools"]
    command: ["/usr/local/bin/bootstrap-admin"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    restart: "no"

  seed-university:
    image: postgres:18.6-alpine
    profiles: ["tools"]
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - target-db
      - -p
      - "5432"
      - -U
      - ${TARGET_DB_USER:-target_owner}
      - -d
      - ${TARGET_DB_NAME:-target_db}
      - -f
      - /seeds/seed.sql
    environment:
      PGPASSWORD: ${TARGET_DB_PASSWORD:-target_dev_password}
    volumes:
      - ./database/seeds/university:/seeds:ro
    depends_on:
      target-db:
        condition: service_healthy
    restart: "no"

  # Bonus observability: docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dbmp-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/collector.yaml"]
    volumes:
      - ./observability/otel/collector.yaml:/etc/otelcol-contrib/collector.yaml:ro
      - app-logs:/var/log/dbmp:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      - loki
      - tempo
    restart: unless-stopped

volumes:
  platform-db-data:
  target-db-data:
  mysql-target-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  app-logs:
