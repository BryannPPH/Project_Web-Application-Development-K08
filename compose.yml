name: wbd-k08

x-backend-image: &backend-image
  image: wbd-k08-backend:local
  build:
    context: ./backend

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_ADDRESS: ":8080"
  HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-3m}
  HTTP_TRUSTED_ORIGINS: ${HTTP_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  PLATFORM_DATABASE_URL: postgres://${PLATFORM_DB_USER:-platform}:${PLATFORM_DB_PASSWORD:-platform_dev_password}@platform-db:5432/${PLATFORM_DB_NAME:-platform_db}?sslmode=disable
  PLATFORM_DB_MIN_CONNECTIONS: ${PLATFORM_DB_MIN_CONNECTIONS:-2}
  PLATFORM_DB_MAX_CONNECTIONS: ${PLATFORM_DB_MAX_CONNECTIONS:-10}
  PLATFORM_DB_MAX_CONNECTION_IDLE: ${PLATFORM_DB_MAX_CONNECTION_IDLE:-5m}
  PLATFORM_DB_MAX_CONNECTION_LIFETIME: ${PLATFORM_DB_MAX_CONNECTION_LIFETIME:-30m}
  PLATFORM_DB_HEALTH_TIMEOUT: ${PLATFORM_DB_HEALTH_TIMEOUT:-5s}
  SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-30m}
  SESSION_ABSOLUTE_TIMEOUT: ${SESSION_ABSOLUTE_TIMEOUT:-12h}
  SESSION_ROTATION_INTERVAL: ${SESSION_ROTATION_INTERVAL:-15m}
  SESSION_PREVIOUS_TOKEN_GRACE: ${SESSION_PREVIOUS_TOKEN_GRACE:-30s}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dbmp_session}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-10}
  LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-1m}
  MANAGED_DB_CREDENTIAL_KEY: ${MANAGED_DB_CREDENTIAL_KEY:?MANAGED_DB_CREDENTIAL_KEY wajib diisi pada .env}
  MANAGED_DB_CREDENTIAL_KEY_VERSION: ${MANAGED_DB_CREDENTIAL_KEY_VERSION:-1}

services:
  platform-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${PLATFORM_DB_USER:-platform}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:-platform_dev_password}
      POSTGRES_DB: ${PLATFORM_DB_NAME:-platform_db}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "${PLATFORM_DB_PORT:-55432}:5432"
    volumes:
      - platform-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  target-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${TARGET_DB_USER:-target_owner}
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD:-target_dev_password}
      POSTGRES_DB: ${TARGET_DB_NAME:-target_db}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "${TARGET_DB_PORT:-55433}:5432"
    volumes:
      - target-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    <<: *backend-image
    command: ["/usr/local/bin/migrate", "up"]
    environment: *backend-environment
    depends_on:
      platform-db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-image
    command: ["/usr/local/bin/api"]
    environment: *backend-environment
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      platform-db:
        condition: service_healthy
      target-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    image: wbd-k08-frontend:local
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  bootstrap-admin:
    <<: *backend-image
    profiles: ["tools"]
    command: ["/usr/local/bin/bootstrap-admin"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    restart: "no"

volumes:
  platform-db-data:
  target-db-data:

